[project]
name = "chipsocket"
version = "0.2.1"
description = "chipsocket — one contract, several live implementations: the socket runner for chip"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Marc Lavallee" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# The only dependency, by design: the runner is the second host, and a second
# host that imports the first is not one. `somm` is an optional extra.
dependencies = ["chipspec>=0.3"]

[project.optional-dependencies]
somm = ["somm>=0.17"]
typesafe = ["typesafe-sdk>=0.6"]

[project.scripts]
chipsocket = "chipsocket.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/lavallee/chipsocket"
Repository = "https://github.com/lavallee/chipsocket"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chipsocket"]

[tool.uv.sources]
# chipspec is not on PyPI yet (trusted publisher pending), so the sibling
# checkout is the source. CI clones lavallee/chip to ../chip for the same reason.
chipspec = { path = "../chip", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
